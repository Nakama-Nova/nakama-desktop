name: Desktop CI

on:
  push:
    branches: [ main, 'feature/*', 'ci/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Libraries Qt needs to start headless (offscreen) on a bare runner.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Syntax errors and undefined names only: the codebase is not style-clean.
      - name: Lint (errors only)
        run: flake8 . --select=E9,F63,F7,F82 --exclude=venv,.venv,data

      - name: Run tests (headless Qt)
        run: pytest -v
